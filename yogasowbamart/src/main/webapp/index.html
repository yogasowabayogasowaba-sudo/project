<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to YogasowbaMart</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .welcome-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-buyer { background-color: #2563eb; color: white; }
        .btn-buyer:hover { background-color: #1d4ed8; }
        .btn-seller { background-color: #16a34a; color: white; }
        .btn-seller:hover { background-color: #15803d; }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Welcome to YogasowbaMart</h1>
        <p>Please select your login type</p>
        
        <a href="buyerLogin.html" class="btn btn-buyer">🛒 Buyer Login</a>
        <a href="sellerLogin.html" class="btn btn-seller">🏪 Seller Login</a>
    </div>
</body>
</html>
