<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogasowba Mart - Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { margin: 0; font-size: 22px; }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }
        .price { color: #27ae60; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .btn-buy {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-buy:hover { background-color: #d35400; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Yogasowba Mart</h1>
        <span>Welcome, User!</span>
    </div>

    <div class="container">
        <h2>Our Featured Products</h2>
        <div class="products-grid">
            
            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Product 1">
                <h3>Smart Watch</h3>
                <p class="price">₹1,999</p>
                <button class="btn-buy" onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Product 2">
                <h3>Wireless Headphones</h3>
                <p class="price">₹1,299</p>
                <button class="btn-buy" onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Product 3">
                <h3>Backpack</h3>
                <p class="price">₹899</p>
                <button class="btn-buy" onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Product 4">
                <h3>Sneakers</h3>
                <p class="price">₹2,499</p>
                <button class="btn-buy" onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>

        </div>
    </div>

</body>
</html>
