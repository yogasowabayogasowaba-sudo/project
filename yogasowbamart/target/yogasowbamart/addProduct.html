<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Product - Yogashowba Mart</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add New Product</h2>
    <form action="addProduct" method="post">
        <label>Product Name:</label>
        <input type="text" name="name" placeholder="Enter product name" required>
        
        <label>Description:</label>
        <textarea name="description" placeholder="Enter product description" required></textarea>
        
        <label>Price (₹):</label>
        <input type="number" step="0.01" name="price" placeholder="Enter price" required>
        
        <label>Stock Quantity:</label>
        <input type="number" name="stock" placeholder="Enter available stock" required>
        
        <label>Category:</label>
        <input type="text" name="category" placeholder="Enter category (e.g., Silk Saree, Dhoti)" required>
        
        <button type="submit">Add Product</button>
    </form>
</div>

</body>
</html>
