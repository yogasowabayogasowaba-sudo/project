<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seller Registration - Yogashowba Mart</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 380px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #16a34a; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #15803d; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #2563eb; text-decoration: none; }
    </style>
    <script>
        function validateForm() {
            var pass = document.getElementById("password").value;
            var confirmPass = document.getElementById("confirmPassword").value;
            if (pass !== confirmPass) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

    <div class="card">
        <h2>Seller Registration</h2>
        <form action="sellerRegister" method="post" onsubmit="return validateForm()">
            <div class="form-group">
                <label>Seller Name:</label>
                <input type="text" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" id="password" required placeholder="Enter password">
            </div>
            <div class="form-group">
                <label>Confirm Password:</label>
                <input type="password" id="confirmPassword" required placeholder="Confirm password">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="link">
            Already have an account? <a href="sellerLogin.html">Back to Seller Login</a>
        </div>
    </div>

</body>
</html>
